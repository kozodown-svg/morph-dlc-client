plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://api.modrinth.com/maven' }        // baritone / other mods, if resolvable
	maven { url = 'https://maven.meteordev.org/releases' }  // baritone (meteor fork), if needed
	maven { url = layout.projectDirectory.dir('libs-repo') }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation 'org.java-websocket:Java-WebSocket:1.5.6'
	implementation 'org.javassist:javassist:3.29.2-GA'
	implementation 'org.json:json:20230618'
	implementation 'org.reflections:reflections:0.10.2'
	implementation 'io.netty:netty-codec-socks:4.1.101.Final'
	implementation 'io.netty:netty-handler-proxy:4.1.101.Final'

	// Decompiled sources still carry lombok @Generated annotations (bodies are already expanded).
	// compileOnly is enough to satisfy the imports.
	compileOnly 'org.projectlombok:lombok:1.18.34'
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	// Decompiled code can trip strict checks; keep the compiler lenient so best-effort builds proceed.
	it.options.compilerArgs += ['-Xlint:none', '-nowarn', '-Xmaxerrs', '2000']
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

loom {
	mixin {
		// Loom 1.17 disabled the mixin annotation processor by default. The decompiled sources ARE
		// mixins whose @Inject/@Shadow refs are now Yarn-named, so we need the AP to regenerate a
		// matching refmap for runClient. Keep the original refmap filename for consistency.
		useLegacyMixinAp = true
		defaultRefmapName = 'morph-refmap.json'
	}
}
